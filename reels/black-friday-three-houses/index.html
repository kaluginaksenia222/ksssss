<!doctype html>
<html lang="ru" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Onest BF"; font-weight: 500; src: url("assets/fonts/onest-latin-500-normal.woff2") format("woff2"); unicode-range: U+0000-00FF; }
      @font-face { font-family: "Onest BF"; font-weight: 500; src: url("assets/fonts/onest-cyrillic-500-normal.woff2") format("woff2"); unicode-range: U+0400-04FF; }
      @font-face { font-family: "Onest BF"; font-weight: 800; src: url("assets/fonts/onest-latin-800-normal.woff2") format("woff2"); unicode-range: U+0000-00FF; }
      @font-face { font-family: "Onest BF"; font-weight: 800; src: url("assets/fonts/onest-cyrillic-800-normal.woff2") format("woff2"); unicode-range: U+0400-04FF; }

      :root { --ink: #ffffff; --accent: #ff2a2a; --warm-0: #ffcf7e; --warm-1: #ffdca2; --warm-2: #f4b35c; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: absolute; inset: 0; background: #000; }
      #scene { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; }

      #city { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 540px 1000px; }
      .facade { position: absolute; background: #08080a; box-shadow: 0 0 0 1px #0f0f12; }
      .win { position: absolute; width: 30px; height: 38px; background: #0d0d10; }
      .lit { position: absolute; inset: 0; opacity: 0; }
      .lit::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: rgba(20, 12, 4, 0.55); }
      .lit::after { content: ""; position: absolute; left: 0; right: 0; top: 34%; height: 2px; background: rgba(20, 12, 4, 0.55); }
      .t0 .lit { background: linear-gradient(180deg, #ffe0a8, var(--warm-0)); box-shadow: 0 0 16px rgba(255, 190, 100, 0.35); }
      .t1 .lit { background: linear-gradient(180deg, #fff0cf, var(--warm-1)); box-shadow: 0 0 16px rgba(255, 210, 150, 0.32); }
      .t2 .lit { background: linear-gradient(180deg, #ffcf86, var(--warm-2)); box-shadow: 0 0 16px rgba(244, 170, 80, 0.35); }

      .label {
        position: absolute; top: 1262px; text-align: center; white-space: pre; line-height: 1.15;
        font-family: "Onest BF", sans-serif; font-weight: 800; font-size: 26px; letter-spacing: 0.03em; color: var(--ink);
      }

      #text { position: absolute; left: 0; right: 0; top: 300px; display: flex; flex-direction: column; align-items: center; font-family: "Onest BF", sans-serif; }
      .line { position: relative; white-space: pre; line-height: 1; }
      #l1 { font-weight: 800; font-size: 76px; letter-spacing: 0.01em; color: var(--ink); }
      #l2 { font-weight: 800; font-size: 50px; letter-spacing: 0.01em; color: var(--ink); margin-top: 22px; }
      #l3 { font-weight: 800; font-size: 36px; letter-spacing: 0.04em; color: var(--accent); margin-top: 40px; }
      .ch { color: transparent; }
      #fade { position: absolute; inset: 0; background: #000; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="1080" data-height="1920">
      <div id="scene" class="clip" data-start="0" data-duration="15" data-track-index="0" data-track-kind="graphics" data-layout-ignore>
        <div id="city"></div>
        <div id="text">
          <div id="l1" class="line"></div>
          <div id="l2" class="line"></div>
          <div id="l3" class="line"></div>
        </div>
        <div id="fade"></div>
      </div>
      <audio id="sfx" class="clip" src="assets/sfx/sfx.wav" data-start="0" data-duration="15" data-track-index="1" data-volume="1"></audio>
    </div>
    <script>
      // ===== тексты =====
      const LINES = ["ЧЕРНАЯ ПЯТНИЦА", "ВЫСОЦКИЙ ДЕВЕЛОПМЕНТ", "ВО ВСЕХ НАШИХ КОМПЛЕКСАХ"];
      // три дома: колонки × этажи, подпись, когда загорается
      const HOUSES = [
        { cols: 4, rows: 10, name: "ЖК ЛУВР", on: 6.3 },
        { cols: 5, rows: 8, name: "ЖК 9\nКОСМОНАВТОВ", on: 7.6 },
        { cols: 4, rows: 9, name: "ЖК БОЛЬШОЙ\nКАРЕТНЫЙ", on: 8.9 },
      ];
      const T = { off0: 0.6, off1: 3.0, text: 3.25, fade: 14.1, end: 15 };
      const CW = 52, CH = 60, GAP = 70, BOTTOM = 1240, PAD = 11;

      const hash = (a, b, c = 0) => {
        let h = (a * 374761393 + b * 668265263 + c * 2246822519) >>> 0;
        h = ((h ^ (h >>> 13)) * 1274126177) >>> 0;
        return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
      };

      // ===== дома и окна с расписанием =====
      const city = document.getElementById("city");
      const totalW = HOUSES.reduce((s, h) => s + h.cols * CW, 0) + GAP * (HOUSES.length - 1);
      let x = Math.round((1080 - totalW) / 2);
      const WINS = [];
      const LABELS = [];
      HOUSES.forEach((h, hi) => {
        const w = h.cols * CW, ht = h.rows * CH, top = BOTTOM - ht;
        const f = document.createElement("div");
        f.className = "facade";
        Object.assign(f.style, { left: x - 8 + "px", top: top - 10 + "px", width: w + 16 + "px", height: ht + 10 + "px" });
        city.appendChild(f);
        for (let r = 0; r < h.rows; r++)
          for (let c = 0; c < h.cols; c++) {
            const id = WINS.length;
            const el = document.createElement("div");
            el.className = "win t" + Math.floor(hash(hi, id, 1) * 3);
            el.style.left = x + c * CW + PAD + "px";
            el.style.top = top + r * CH + PAD + "px";
            const lit = document.createElement("div"); lit.className = "lit"; el.appendChild(lit); city.appendChild(el);
            // гаснут всё чаще (как в «Дом гасит свет»), загораются снизу вверх волной
            const u = hash(id, 7, 2);
            const off = T.off0 + (T.off1 - T.off0) * Math.pow(u, 0.6);
            const on = h.on + (h.rows - 1 - r) * 0.06 + hash(id, 3, 4) * 0.12;
            const keepDark = hash(id, 9, 5) < 0.12;
            WINS.push({ lit, b: 0.8 + 0.2 * hash(id, 5, 6), off, on, keepDark });
          }
        // подпись под домом
        const lab = document.createElement("div");
        lab.className = "label";
        lab.style.left = x - 40 + "px"; lab.style.width = w + 80 + "px";
        city.appendChild(lab);
        LABELS.push({ el: lab, text: h.name, t: h.on + 0.25 });
        x += w + GAP;
      });

      // ===== буквы =====
      function typeTimes(lines, start, steps, gaps) {
        const out = []; let t = start;
        lines.forEach((text, li) => {
          if (li > 0) t += gaps[li - 1];
          const row = [];
          for (const ch of text) { row.push(t); t += steps[li] + (ch === " " ? 0.035 : 0); }
          out.push(row); t = row.at(-1);
        });
        return out;
      }
      const TIMES = typeTimes(LINES, T.text, [0.05, 0.034, 0.03], [0.25, 0.25]);
      const chars = LINES.map((txt, i) => {
        const line = document.getElementById(["l1", "l2", "l3"][i]);
        return [...txt].map((ch) => { const s = document.createElement("span"); s.className = "ch"; s.textContent = ch; line.appendChild(s); return s; });
      });
      // подписи домов тоже печатаются
      const LAB_TIMES = [];
      LABELS.forEach((L) => {
        const ts = []; let t = L.t;
        L.spans = [...L.text].map((ch) => {
          if (ch === "\n") { L.el.appendChild(document.createElement("br")); return null; }
          const s = document.createElement("span"); s.className = "ch"; s.textContent = ch; L.el.appendChild(s);
          ts.push(t); t += 0.04; return s;
        }).filter(Boolean);
        L.times = ts; LAB_TIMES.push(...ts);
      });
      const ON_TIMES = WINS.filter((w) => !w.keepDark).map((w) => w.on);
      const OFF_TIMES = WINS.map((w) => w.off);

      function lampOn(dt) {
        if (dt < 0) return [0, 0];
        if (dt < 0.03) return [0.5, 1];
        if (dt < 0.06) return [0.15, 1];
        if (dt < 0.09) return [1, 1];
        return [1, Math.max(0, 1 - (dt - 0.09) / 0.6)];
      }
      function lampOff(dt) {
        if (dt < 0) return 1;
        if (dt < 0.03) return 0.35;
        if (dt < 0.055) return 0.6;
        if (dt < 0.09) return 0.12;
        return 0;
      }
      function paint(s, o, glow, red) {
        s.style.color = o === 0 ? "transparent" : "inherit";
        s.style.opacity = o;
        s.style.textShadow = glow > 0 ? `0 0 ${(6 + 22 * glow).toFixed(1)}px ${red ? "rgba(255, 50, 40," : "rgba(255, 196, 110,"} ${(0.85 * glow).toFixed(2)})` : "none";
      }

      function render(t) {
        for (const w of WINS) {
          let v = w.b * lampOff(t - w.off);
          if (!w.keepDark && t >= w.on) v = w.b * lampOn(t - w.on)[0];
          w.lit.style.opacity = v.toFixed(3);
        }
        chars.forEach((row, li) => row.forEach((s, i) => { const [o, g] = lampOn(t - TIMES[li][i]); paint(s, o, g, li === 2); }));
        LABELS.forEach((L) => L.spans.forEach((s, i) => { const [o, g] = lampOn(t - L.times[i]); paint(s, o, g, false); }));
      }

      const tl = gsap.timeline({ paused: true, onUpdate: () => render(tl.time()) });
      tl.fromTo("#city", { scale: 1 }, { scale: 1.05, duration: T.end, ease: "none" }, 0);
      tl.fromTo("#fade", { opacity: 0 }, { opacity: 1, duration: T.end - T.fade - 0.1, ease: "power1.in" }, T.fade);
      window.__timelines["main"] = tl;
      tl.seek(0);
      render(0);
    </script>
  </body>
</html>
