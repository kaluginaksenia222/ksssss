<!doctype html><html lang="ru"><head><meta charset="utf-8">
<style>
@font-face{font-family:Inter;font-weight:400;src:url(../../library/fonts/inter-cyrillic-400-normal.woff2)}
@font-face{font-family:Inter;font-weight:400;src:url(../../library/fonts/inter-latin-400-normal.woff2);unicode-range:U+0000-00FF}
@font-face{font-family:Inter;font-weight:500;src:url(../../library/fonts/inter-cyrillic-500-normal.woff2)}
@font-face{font-family:Inter;font-weight:500;src:url(../../library/fonts/inter-latin-500-normal.woff2);unicode-range:U+0000-00FF}
@font-face{font-family:Inter;font-weight:700;src:url(../../library/fonts/inter-cyrillic-700-normal.woff2)}
@font-face{font-family:Inter;font-weight:700;src:url(../../library/fonts/inter-latin-700-normal.woff2);unicode-range:U+0000-00FF}
@font-face{font-family:Tight;font-weight:800;src:url(../../library/fonts/inter-tight-cyrillic-800-normal.woff2)}
@font-face{font-family:Tight;font-weight:800;src:url(../../library/fonts/inter-tight-latin-800-normal.woff2);unicode-range:U+0000-00FF}
:root{--wine:#7F3F3F;--bg:#F4F1EE;--ink:#2B2424;--muted:#9A908C;--line:#DCD3CD}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:var(--bg);font-family:Inter;color:var(--ink);position:relative;overflow:hidden}
.top{position:absolute;top:110px;left:0;right:0;text-align:center}
.top img{height:96px}
.head{position:absolute;top:300px;left:0;right:0;text-align:center}
.kicker{font-size:24px;font-weight:500;letter-spacing:6px;color:var(--muted);text-transform:uppercase}
.title{margin-top:22px;font-family:Inter;font-weight:700;font-size:52px;letter-spacing:1px;color:var(--wine);text-transform:uppercase}
.sub{margin-top:14px;font-size:28px;font-weight:400;letter-spacing:2px;color:var(--ink)}
.sub i{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--wine);vertical-align:middle;margin:0 18px;font-style:normal}
.plan{position:absolute;top:560px;left:110px;right:110px;height:760px;display:flex;align-items:center;justify-content:center}
.plan img{max-width:860px;max-height:720px}
.rooms{position:absolute;top:1370px;left:110px;right:110px;display:flex;justify-content:space-between;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:26px 0}
.rooms div{text-align:center;flex:1}
.rooms div+div{border-left:1px solid var(--line)}
.rooms span{display:block;font-size:20px;letter-spacing:3px;color:var(--muted);text-transform:uppercase}
.rooms b{display:block;margin-top:8px;font-size:30px;font-weight:500}
.price{position:absolute;top:1540px;left:0;right:0;text-align:center}
.old{font-size:28px;color:var(--muted);text-decoration:line-through;text-decoration-thickness:2px}
.old em{font-style:normal;text-decoration:none;display:inline-block;margin-left:14px;background:var(--wine);color:#fff;font-size:22px;font-weight:700;padding:5px 12px;border-radius:8px;vertical-align:3px}
.new{font-family:Inter;font-weight:700;font-size:68px;letter-spacing:-1px;color:var(--wine);margin-top:6px}
.cta{position:absolute;bottom:90px;left:0;right:0;text-align:center;font-size:22px;letter-spacing:5px;color:var(--muted);font-weight:500}
.cta b{color:var(--wine);font-weight:700;letter-spacing:3px}
</style></head><body>
<div class="top"><img src="assets/logo.png"></div>
<div class="head"><div class="kicker" id="kicker"></div><div class="title" id="title"></div><div class="sub" id="sub"></div></div>
<div class="plan"><img id="plan"></div>
<div class="rooms" id="chips"></div>
<div class="price"><div class="old" id="old"></div><div class="new" id="new"></div></div>
<div class="cta">ПОДРОБНОСТИ: <b>303-99-99</b></div>
<script>
const d=JSON.parse(decodeURIComponent(location.hash.slice(1)));
const rub=n=>n.toLocaleString('ru-RU').replace(/\u00a0/g,'\u2009')+' ₽';
const $=id=>document.getElementById(id);
$('kicker').textContent='Квартира №'+d.number;
$('title').textContent=d.roomsLabel.split(' ')[0]+' · '+String(d.area).replace('.',',')+' м²';
$('sub').innerHTML=[d.floor+' этаж',d.finish].join('<i></i>');
$('chips').innerHTML=d.chips.map(c=>`<div><span>${c[0]}</span><b>${c[1]}</b></div>`).join('');
$('plan').src=d.plan;
if(d.oldPrice){$('old').innerHTML=rub(d.oldPrice)+'<em>−'+Math.round((1-d.price/d.oldPrice)*100)+'%</em>'}else{$('old').remove()}
$('new').textContent=rub(d.price);
</script></body></html>
