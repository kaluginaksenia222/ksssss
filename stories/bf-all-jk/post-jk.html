<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<style>
  @font-face { font-family: "Onest S"; font-weight: 500; src: url("assets/onest-cyrillic-500-normal.woff2"); unicode-range: U+0400-04FF; }
  @font-face { font-family: "Onest S"; font-weight: 500; src: url("assets/onest-latin-500-normal.woff2"); unicode-range: U+0000-00FF, U+2000-206F; }
  @font-face { font-family: "Onest S"; font-weight: 800; src: url("assets/onest-cyrillic-800-normal.woff2"); unicode-range: U+0400-04FF; }
  @font-face { font-family: "Onest S"; font-weight: 800; src: url("assets/onest-latin-800-normal.woff2"); unicode-range: U+0000-00FF, U+2000-206F; }
  :root { --red: #e0212b; --ink: #f4f2ee; --ink2: #9d9b97; --line: rgba(244, 242, 238, 0.18); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1080px; overflow: hidden; }
  body { position: relative; font-family: "Onest S", sans-serif; color: var(--ink); background: #0a0a0a url("assets/bg.png") 0 -420px / 1080px 1920px no-repeat; }
  /* мягкий тёплый свет сверху — как из окна */
  body::before { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse 70% 45% at 50% 0%, rgba(255, 196, 120, 0.10), transparent 70%); }
  /* тонкая рамка */
  #frame { position: absolute; inset: 40px; border: 1px solid var(--line); }
  #wrap { position: absolute; left: 0; right: 0; top: 120px; text-align: center; }
  #kicker { font-weight: 500; font-size: 22px; letter-spacing: 0.42em; color: var(--ink2); }
  #bf { font-weight: 800; font-size: 118px; line-height: 0.95; letter-spacing: -0.015em; margin-top: 26px; }
  #accent { width: 120px; height: 6px; background: var(--red); margin: 40px auto 0; }
  #all { font-weight: 800; font-size: 44px; letter-spacing: 0.06em; margin-top: 38px; }
  #list { width: 700px; margin: 52px auto 0; }
  .row { display: flex; align-items: baseline; justify-content: space-between; padding: 22px 6px; border-top: 1px solid var(--line); }
  .row:last-child { border-bottom: 1px solid var(--line); }
  .n { font-weight: 500; font-size: 22px; letter-spacing: 0.12em; color: var(--ink2); width: 70px; text-align: left; }
  .name { flex: 1; font-weight: 800; font-size: 40px; letter-spacing: 0.04em; text-align: left; }
  .jk { font-weight: 500; font-size: 22px; letter-spacing: 0.24em; color: var(--ink2); }
  #logo { position: absolute; left: 50%; bottom: 74px; width: 170px; margin-left: -85px; }
</style>
</head>
<body>
  <div id="frame"></div>
  <div id="wrap">
    <div id="kicker">ВЫСОЦКИЙ ДЕВЕЛОПМЕНТ</div>
    <div id="bf">ЧЁРНАЯ<br />ПЯТНИЦА</div>
    <div id="accent"></div>
    <div id="all">ВО ВСЕХ НАШИХ ЖК</div>
    <div id="list">
      <div class="row"><span class="n">01</span><span class="name">ЛУВР</span><span class="jk">ЖК</span></div>
      <div class="row"><span class="n">02</span><span class="name">9 КОСМОНАВТОВ</span><span class="jk">ЖК</span></div>
      <div class="row"><span class="n">03</span><span class="name">БОЛЬШОЙ КАРЕТНЫЙ</span><span class="jk">ЖК</span></div>
    </div>
  </div>
  <img id="logo" src="assets/logo-white.png" alt="" />
</body>
</html>
