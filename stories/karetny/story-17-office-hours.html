<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="story.css">
<style>
.mark{position:absolute;left:50%;transform:translateX(-50%);opacity:.08;width:900px;height:auto}
.card{background:var(--band);color:#fff;border-radius:10px;padding:34px 40px;display:flex;gap:26px;align-items:flex-start;font-size:36px;line-height:1.35}
.card svg{flex:none;width:44px;height:56px;margin-top:4px}
.small{font-size:30px;color:var(--muted);line-height:1.4}
.rows{margin-top:40px;display:flex;flex-direction:column}
.row{display:flex;justify-content:space-between;align-items:baseline;padding:34px 0;border-top:2px solid #e2dbd6;font-size:40px}
.row:last-child{border-bottom:2px solid #e2dbd6}
.row b{font-weight:500}
.row span{font-family:Oswald,sans-serif;font-weight:600;font-size:46px;font-variant-numeric:tabular-nums}
.phone{margin-top:22px;align-self:flex-start;background:var(--band);color:#fff;font-family:Oswald,sans-serif;font-weight:600;font-size:52px;padding:12px 32px;border-radius:8px;letter-spacing:.5px}
.steps{margin-top:40px;display:flex;flex-direction:column;gap:40px}
.step{display:grid;grid-template-columns:64px 1fr;gap:24px;align-items:start;font-size:38px;line-height:1.35}
.num{width:64px;height:64px;border-radius:50%;background:var(--band);color:#fff;font-family:Oswald,sans-serif;font-weight:600;font-size:36px;display:flex;align-items:center;justify-content:center}
</style></head><body><div class="story">
  <img class="logo" src="assets/logo-red.png" alt="">
  <div class="text" style="top:400px">
    <span class="eyebrow">Офис продаж ЖК «Большой каретный»</span>
    <h2>Работаем и&nbsp;в&nbsp;выходные</h2>
    <div class="rows">
      <div class="row"><b>Пн–Чт</b><span>10:00–19:00</span></div>
      <div class="row"><b>Пт</b><span>10:00–18:00</span></div>
      <div class="row"><b>Сб–Вс</b><span>11:00–17:00</span></div>
    </div>
    <p style="margin-top:56px">Планируете визит? Запишитесь на&nbsp;встречу:</p>
    <span class="phone">+7 (343) 303-99-99</span>
    <p class="small" style="margin-top:40px">ул.&nbsp;Малышева, 51, БЦ&nbsp;«Высоцкий», 1&nbsp;этаж</p>
  </div>
</div></body></html>
