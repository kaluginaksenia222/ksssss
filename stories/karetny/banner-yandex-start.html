<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="story.css">
<style>
/* баннер акции Яндекс: 900×480, рендерится в 2× (1800×960). Слева текст на светлом, справа рендер */
html,body{width:900px;height:480px}
.banner{position:relative;width:900px;height:480px;overflow:hidden;background:var(--paper);font-family:Inter,sans-serif;color:var(--ink)}
.photo{top:0;left:auto;right:0;width:520px;height:480px;background:url(assets/IMG_9942.png) 46% 50%/auto 100% no-repeat}
.photo::after{inset:0 auto 0 0;width:200px;height:auto;background:linear-gradient(90deg,var(--paper),rgba(245,243,240,0))}
.left{position:absolute;left:52px;top:44px;bottom:44px;width:470px;display:flex;flex-direction:column}
.left img{width:170px}
.left h1{margin-top:auto;font-family:Oswald,sans-serif;font-weight:600;font-size:60px;line-height:1.04;letter-spacing:-.3px;text-transform:uppercase}
.left h1 em{font-style:normal;color:var(--brand)}
.plate{margin-top:22px;align-self:flex-start;background:var(--band);color:#fff;font-family:Oswald,sans-serif;font-weight:600;font-size:30px;text-transform:uppercase;letter-spacing:.5px;padding:8px 22px;border-radius:5px}
</style></head>
<body><div class="banner">
  <div class="photo"></div>
  <div class="left">
    <img src="assets/logo-red.png" alt="">
    <h1>Старт продаж квартир <em>от&nbsp;3&nbsp;млн!</em></h1>
    <span class="plate">Вторая очередь</span>
  </div>
</div></body></html>
