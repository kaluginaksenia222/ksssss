<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="story.css">
<style>
/* новость в Яндекс Картах: лента режет картинку в горизонталь ~16:10.
   Делаем 800×500 (рендер 2× = 1600×1000), всё важное внутри полей 60 px, чтобы пережило и 16:9 */
html,body{width:800px;height:500px}
.news{position:relative;width:800px;height:500px;overflow:hidden;background:var(--paper);font-family:Inter,sans-serif;color:var(--ink)}
.photo{top:0;left:auto;right:0;width:370px;height:500px;background:url(assets/IMG_9939.png) 62% 50%/auto 100% no-repeat}
.photo::after{inset:0 auto 0 0;width:70px;height:auto;background:linear-gradient(90deg,var(--paper),rgba(245,243,240,0))}
.left{position:absolute;left:52px;top:60px;bottom:60px;width:340px;display:flex;flex-direction:column}
.left img{width:150px}
.left h1{margin-top:auto;font-family:Oswald,sans-serif;font-weight:600;font-size:44px;line-height:1.06;letter-spacing:-.3px;text-transform:uppercase}
.plate{margin-top:18px;align-self:flex-start;background:var(--band);color:#fff;font-family:Oswald,sans-serif;font-weight:600;font-size:25px;text-transform:uppercase;letter-spacing:.5px;padding:7px 18px;border-radius:5px}
</style></head>
<body><div class="news">
  <div class="photo"></div>
  <div class="left">
    <img src="assets/logo-red.png" alt="">
    <h1>Старт продаж<br>второй очереди</h1>
    <span class="plate">Квартиры от 3 млн&nbsp;₽</span>
  </div>
</div></body></html>
