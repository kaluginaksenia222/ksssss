<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face { font-family: "Onest S"; font-weight: 500; src: url("assets/fonts/onest-cyrillic-500-normal.woff2") format("woff2"); unicode-range: U+0400-04FF, U+20BD, U+2116; }
      @font-face { font-family: "Onest S"; font-weight: 500; src: url("assets/fonts/onest-latin-500-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+00B2; }
      @font-face { font-family: "Onest S"; font-weight: 800; src: url("assets/fonts/onest-cyrillic-800-normal.woff2") format("woff2"); unicode-range: U+0400-04FF, U+20BD, U+2116; }
      @font-face { font-family: "Onest S"; font-weight: 800; src: url("assets/fonts/onest-latin-800-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+00B2; }

      :root {
        --red: #c8141f;
        --white: #f4f1ec;
        --ink: #1c1c1e;
        --ink-2: #6c6c70;
        --gray: #8e8e93;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b0b; }
      body { position: relative; font-family: "Onest S", sans-serif; color: var(--white); background: #0b0b0b url("assets/bg.png") 0 0 / 1080px 1920px no-repeat; }

      /* ---------- ленты SALE ---------- */
      .tape {
        position: absolute; left: -200px; width: 1480px; height: 66px;
        background: var(--red); box-shadow: 0 10px 24px rgba(0, 0, 0, 0.55);
        display: flex; align-items: center; gap: 64px; padding-left: 30px;
        white-space: nowrap; overflow: hidden;
      }
      .tape span { font-weight: 800; font-size: 30px; letter-spacing: 0.04em; color: #fff; }

      /* ---------- заголовок ---------- */
      #jk { position: absolute; top: 300px; left: 0; right: 0; text-align: center; font-weight: 500; font-size: 30px; letter-spacing: 0.24em; color: rgba(244, 241, 236, 0.85); }
      #title { position: absolute; top: 346px; left: 0; right: 0; text-align: center; font-weight: 800; font-size: 108px; line-height: 1; letter-spacing: -0.02em; }
      #title .r { color: var(--red); }

      /* ---------- карточка квартиры ---------- */
      #card { position: absolute; left: 70px; top: 500px; width: 940px; height: 800px; border-radius: 36px; background: #fff; }
      #head { position: absolute; left: 52px; right: 52px; top: 44px; display: flex; justify-content: space-between; color: var(--ink); }
      .big { font-weight: 800; font-size: 40px; line-height: 1.1; }
      .small { font-weight: 500; font-size: 30px; line-height: 1.3; color: var(--ink-2); }
      #head .right { text-align: right; }
      #planBox { position: absolute; left: 52px; top: 186px; width: 836px; height: 590px; display: flex; align-items: center; justify-content: center; }
      #plan { max-width: 836px; max-height: 590px; }

      /* ---------- выгода: красный билет ---------- */
      #ticket {
        position: absolute; left: 92px; top: 1262px; width: 330px; height: 170px;
        transform: rotate(-7deg);
        background: var(--red);
        -webkit-mask:
          radial-gradient(circle 13px at 0 50%, transparent 98%, #000) left / 51% 34px repeat-y,
          radial-gradient(circle 13px at 100% 50%, transparent 98%, #000) right / 51% 34px repeat-y;
        box-shadow: 0 16px 30px rgba(0, 0, 0, 0.5);
        display: flex; flex-direction: column; align-items: center; justify-content: center;
      }
      #ticket::before { content: ""; position: absolute; inset: 14px 26px; border: 2px dashed rgba(255, 255, 255, 0.5); border-radius: 6px; }
      #ticket .l1 { font-weight: 800; font-size: 34px; letter-spacing: 0.06em; }
      #ticket .l2 { font-weight: 800; font-size: 46px; margin-top: 4px; }
      /* вместо «выгоды» — одна крупная скидка */
      #ticket.pct .l1 { display: none; }
      #ticket.pct .l2 { font-size: 92px; letter-spacing: -0.02em; margin-top: 0; }

      /* ---------- цены ---------- */
      #prices { position: absolute; right: 70px; top: 1348px; text-align: right; }
      #old { position: relative; display: inline-block; font-weight: 500; font-size: 40px; color: var(--gray); }
      #old::after { content: ""; position: absolute; left: -4px; right: -4px; top: 52%; height: 4px; background: var(--red); transform: rotate(-4deg); }
      #new { font-weight: 800; font-size: 68px; line-height: 1.15; margin-top: 6px; }

      #logo { position: absolute; left: 50%; top: 1556px; width: 190px; margin-left: -95px; opacity: 0.95; }
    </style>
  </head>
  <body>
    <script src="data/flats.js"></script>
    <!-- ленты сверху -->
    <div class="tape" style="top: 60px; transform: rotate(-7deg)"></div>
    <div class="tape" style="top: 150px; transform: rotate(9deg)"></div>

    <div id="jk"></div>
    <div id="title"><span class="r">BLACK</span> FRIDAY</div>

    <div id="card">
      <div id="head">
        <div><div class="big" id="flat"></div><div class="small" id="finish"></div></div>
        <div class="right"><div class="big" id="area"></div><div class="small" id="floor"></div></div>
      </div>
      <div id="planBox"><img id="plan" alt="" /></div>
    </div>

    <div id="ticket"><div class="l1">ВЫГОДА</div><div class="l2" id="benefit"></div></div>
    <div id="prices"><div id="old"></div><div id="new"></div></div>

    <img id="logo" src="assets/logo-white.png" alt="" />

    <!-- ленты снизу -->
    <div class="tape" style="top: 1760px; transform: rotate(5deg)"></div>
    <div class="tape" style="top: 1830px; transform: rotate(-6deg)"></div>

    <script>
      // ===== данные квартир — в data/flats.js; какая квартира — ?id=… =====
      const id = new URLSearchParams(location.search).get("id") || "303";
      const D = { tape: "SALE", ...window.FLATS[id] };
      document.getElementById("plan").src = `assets/plans/${id}.png`;
      for (const id of ["jk", "flat", "finish", "area", "floor", "benefit"]) document.getElementById(id).textContent = D[id];
      if (D.badge) { document.getElementById("ticket").classList.add("pct"); document.getElementById("benefit").textContent = D.badge; }
      document.getElementById("old").textContent = D.oldPrice;
      document.getElementById("new").textContent = D.newPrice;
      for (const t of document.querySelectorAll(".tape"))
        for (let i = 0; i < 14; i++) { const s = document.createElement("span"); s.textContent = D.tape; t.appendChild(s); }
    </script>
  </body>
</html>
